name: Deploy to GitHub Pages

on:
  # Deploy po merge/push do main (testy + deploy)
  push:
    branches: [ main ]

  # Pull requesty: tylko build + testy, bez deployu
  pull_request:

  # Reczne uruchomienie z zakladki Actions (opcjonalnie pelna macierz przegladarek)
  workflow_dispatch:
    inputs:
      full:
        description: 'Pelna macierz Playwright (Firefox, WebKit, iPhone; FULL=1)'
        type: boolean
        default: false

# Uprawnienia potrzebne do wdrozenia na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Deploy: tylko jeden na raz. Testy PR nie blokuja sie nawzajem (grupa per ref).
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FULL: ${{ inputs.full && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22: @lhci/cli i lighthouse 13 wymagaja >= 22.19 (deploy build zostaje na Node 20)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check (astro check)
        run: npx astro check

      - name: Check base path in dist
        run: npm run test:dist

      - name: Check image budget
        run: npm run test:images

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ inputs.full && 'chromium firefox webkit' || 'chromium' }}

      - name: Playwright (e2e, a11y)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Lighthouse CI
        run: npm run test:lhci

      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: test-results/raporty/lhci/
          if-no-files-found: ignore
          retention-days: 7

      # Informacyjnie: krytyczna podatnosc w astro 5 zniknie po migracji do Astro 7
      - name: npm audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=critical --omit=dev

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
